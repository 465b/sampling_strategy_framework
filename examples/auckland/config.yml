# Auckland Bay - the harder case, and what to copy if yours is like it:
#
#   * a depth band starting at 0 m, so `min_flooded_fraction` is needed to keep
#     sources off intertidal flats. That is the one setting here that requires a
#     SCHISM hindcast; see the note beside it.

name: auckland_bay
version: v00

domain: target_area.csv

hindcast: hauraki_gulf                 # resolved by the machine profile

release_points:
  n: 100
  depth_range: [0, 30]
  # 1.0 keeps only mesh triangles that are wet for the whole hindcast record,
  # excluding intertidal flats that pass depth_range but dry out. Without this
  # they show up as sources undetectable from anywhere.
  min_flooded_fraction: 1.0

source:
  shedding_rate_per_hour: 1.0e7
  copies_per_particle: 100
  release_at_bottom: true
  release_offset_from_surface_or_bottom: 1

model:
  start: '2018-01-01T00:00:00'
  time_step: 120
  duration_hours: 48
  edna_half_life_hours: 6
  critical_friction_velocity: 0.000 # always resuspend
  output_time_interval: 3600
  processors: 4

stats:
  - name: full_auckland_bay_2D
    kind: gridded_2d
    grid_center: [174.7331, -36.824]
    rows: 200
    cols: 200
    span: [0.3, 0.3]
    water_depth_min: 3
    status_list: [moving]
    start: '2018-01-02T00:00:00'
    end: '2018-01-03T00:00:00'

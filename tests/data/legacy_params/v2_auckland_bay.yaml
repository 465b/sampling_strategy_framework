# Auckland Bay, v2 - the run the paper figures are built from.
#
# Reproduces archiv/legacy_model_configuration/model_configuration_auckland_bay.py exactly;
# tests/test_params_equivalence.py asserts that field for field.
name: auckland_bay
version: v2

domain: auckland_bay_poly.csv

hindcast: hauraki_gulf

release_points:
  n: 400
  depth_range: [0, 30]
  seed: 42
  # 1.0 keeps only mesh triangles that are wet for the whole hindcast record,
  # excluding intertidal flats that pass depth_range but dry out. Without this
  # they show up as sources undetectable from anywhere.
  min_flooded_fraction: 1.0

source:
  shedding_rate_per_hour: 1.0e7
  copies_per_particle: 1000
  release_at_bottom: true
  release_offset_from_surface_or_bottom: 1
  max_cycles_to_find_release_points: 59

model:
  time_step: 120
  duration_hours: 47
  edna_half_life_hours: 6
  critical_friction_velocity: 0.009
  output_time_interval: 3600
  processors: 20
  particle_buffer_per_release_group: 100000000
  time_buffer_size: 25
  screen_output_time_interval: 120
  write_tracks: false
  tracks_writer_skip_properties:
    - water_velocity
    - particle_velocity
    - velocity_modifier
    - x_last_good
    - age
    - tide
    - water_depth
    - salinity

chunking:
  release_groups_per_chunk: 1

stats:
  # two vertical references over the same grid, for comparison
  - name: full_auckland_bay_3D_geoid
    kind: gridded_3d
    grid_center: [174.7331, -36.824]
    rows: 200
    cols: 200
    span: [0.3, 0.3]
    layers: 20
    z_min: 0
    z_max: 20
    vertical_range_measured_relative_to: geoid
    water_depth_min: 3
    status_list: [moving]
    start: '2018-01-02T00:00:00'
    end: '2018-01-03T00:00:00'
    write_connectivity: false
    release_group_centered_grids: false

  # the one the paper notebook reads
  - name: full_auckland_bay_3D
    kind: gridded_3d
    grid_center: [174.7331, -36.824]
    rows: 200
    cols: 200
    span: [0.3, 0.3]
    layers: 20
    z_min: 0
    z_max: 20
    vertical_range_measured_relative_to: surface
    water_depth_min: 3
    status_list: [moving]
    start: '2018-01-02T00:00:00'
    end: '2018-01-03T00:00:00'
    write_connectivity: false
    release_group_centered_grids: false
